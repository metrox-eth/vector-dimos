[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-dimos"
version = "0.1.0"
description = "VECTOR, a custom-built holonomic (mecanum) platform, as a dimOS external blueprint package."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy",
    "pymodbus<3.0",
]

[project.optional-dependencies]
# The dimOS runtime itself; the core (kinematics, driver, adapter) is pure
# python and cold-testable without it.
dimos = ["dimos"]
gamepad = ["pygame>=2.6"]
rplidar = ["rplidar-roboticia"]

[project.entry-points."dimos.blueprints"]
base = "vector_dimos.blueprints:base_blueprint"
gamepad = "vector_dimos.blueprints:gamepad_blueprint"
rplidar = "vector_dimos.blueprints:rplidar_blueprint"

[tool.setuptools]
packages = ["vector_dimos"]
