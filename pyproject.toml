[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-dimos"
version = "0.2.0"
description = "VECTOR, a custom-built holonomic (mecanum) platform, as a dimOS external blueprint package."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy",
    "pymodbus<3.0",
]

[project.optional-dependencies]
# No `dimos` extra on purpose. The runtime has to come from git main - the
# external-blueprints mechanism this package plugs into is newer than the PyPI
# release - and an extra cannot express that. The README documents the line:
#     pip install git+https://github.com/dimensionalOS/dimos.git
# The core (kinematics, driver, adapter) is cold-testable without any of it.
gamepad = ["pygame>=2.6"]
rplidar = ["rplidar-roboticia"]

[project.entry-points."dimos.blueprints"]
base = "vector_dimos.blueprints:base_blueprint"
gamepad = "vector_dimos.blueprints:gamepad_blueprint"
rplidar = "vector_dimos.blueprints:rplidar_blueprint"

[tool.setuptools]
packages = ["vector_dimos"]
